<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <h2>Organize your day, one task at a time.</h2>
        <div class="task-input">
            <input type="text" id="task" placeholder="Add a new task..." />
            <button id="add-task">Add Task</button>
        </div>
        <div class="task-stats">
            <span>Total tasks: <span id="total-tasks">0</span></span>
            <span>Active tasks: <span id="active-tasks">0</span></span>
            <span>Completed tasks: <span id="completed-tasks">0</span></span>
        </div>
        <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="completed">Completed</button>
        </div>
        <div id="task-list" class="task-list"></div>
        <button id="clear-completed">Clear Completed</button>
        <div class="empty-state">No tasks yet. Add one to get started!</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
