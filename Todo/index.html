<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-card">
            <h1>Todo List</h1>
            <p>Organize your day, one task at a time.</p>
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button id="add-task-btn">Add Task</button>
            <div class="task-stats">
                <p>Total tasks: <span id="total-tasks">0</span></p>
                <p>Active tasks: <span id="active-tasks">0</span></p>
                <p>Completed tasks: <span id="completed-tasks">0</span></p>
            </div>
            <div class="filters">
                <button id="filter-all">All</button>
                <button id="filter-active">Active</button>
                <button id="filter-completed">Completed</button>
            </div>
            <div id="task-list" class="task-list"></div>
            <button id="clear-completed">Clear Completed</button>
            <div id="empty-state" class="empty-state">No tasks yet. Add one to get started!</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
